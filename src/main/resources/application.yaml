server:
  port: ${PORT:8080} # Render inyecta PORT
app:
  version: 1.0.2
spring:
  application:
    name: ecommerce
  datasource:
    url: jdbc:postgresql://localhost:5434/ecommerce
    username: store
    password: '123456'
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
springdoc:
  api-docs:
    path: /api/v1/api-docs
  swagger-ui:
    path: /api/v1/api-docs