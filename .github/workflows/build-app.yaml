name: CI Pipeline

on:
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java y Caché
        uses: actions/setup-java@v4
        with:
          java-version: '17' 
          distribution: 'temurin'
          cache: 'gradle'

      - name: Dar permisos de ejecución a Gradle
        run: chmod +x ./gradlew

      - name: Compilar el proyecto
        run: ./gradlew classes

  test:
    needs: build
    runs-on: ubuntu-latest
    # Levantamos una base de datos PostgreSQL temporal para las pruebas
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: ecommerce
          POSTGRES_USER: store
          POSTGRES_PASSWORD: 123456
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Dar permisos de ejecución a Gradle
        run: chmod +x ./gradlew

      - name: Ejecutar pruebas
        env:
          SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
        run: ./gradlew test

  security-codeql:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java
      - name: Construir para CodeQL
        uses: github/codeql-action/autobuild@v3
      - name: Analizar vulnerabilidades
        uses: github/codeql-action/analyze@v3

  docker:
    needs: security-codeql
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      # --- NUEVOS PASOS PARA GENERAR EL JAR ---
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Dar permisos de ejecución a Gradle
        run: chmod +x ./gradlew

      - name: Construir el archivo JAR
        run: ./gradlew build -x test
      # ----------------------------------------

      - name: Obtener Short SHA para el etiquetado semántico
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir imagen de Docker
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/acm-ecommerce:${{ env.sha_short }} -t ghcr.io/${{ github.repository_owner }}/acm-ecommerce:latest .

      - name: Escanear imagen con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/${{ github.repository_owner }}/acm-ecommerce:${{ env.sha_short }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Subir resultados de Trivy a GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Publicar imagen de Docker en GHCR
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/acm-ecommerce:${{ env.sha_short }}
          docker push ghcr.io/${{ github.repository_owner }}/acm-ecommerce:latest