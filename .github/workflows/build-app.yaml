# CI: compila, prueba, analiza seguridad y publica la imagen Docker en GHCR.
# - pull_request a main: build -> test -> CodeQL (no publica imagen)
# - push a main:         build -> test -> CodeQL -> docker (Trivy + push a GHCR)
# IMPORTANTE: el nombre "CI" debe coincidir con workflows: ["CI"] en CD.yaml
name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write
  security-events: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/acm-ecommerce

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java y Caché
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Dar permisos de ejecución a Gradle
        run: chmod +x ./gradlew

      - name: Compilar el proyecto
        run: ./gradlew classes --no-daemon

  test:
    needs: build
    runs-on: ubuntu-latest
    # Base de datos PostgreSQL temporal para las pruebas (coincide con application.yaml)
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: ecommerce
          POSTGRES_USER: store
          POSTGRES_PASSWORD: 123456
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Dar permisos de ejecución a Gradle
        run: chmod +x ./gradlew

      - name: Ejecutar pruebas
        run: ./gradlew test --no-daemon

  security-codeql:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java

      - name: Construir para CodeQL
        uses: github/codeql-action/autobuild@v3

      - name: Analizar vulnerabilidades
        uses: github/codeql-action/analyze@v3

  docker:
    # Solo se publica imagen cuando el código ya está integrado en main
    if: github.event_name == 'push'
    needs: security-codeql
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Dar permisos de ejecución a Gradle
        run: chmod +x ./gradlew

      - name: Construir el archivo JAR
        run: ./gradlew bootJar --no-daemon

      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # La imagen se etiqueta con el SHA completo del commit (inmutable, lo usa el CD) y con latest
      - name: Construir imagen de Docker
        run: |
          docker build \
            --build-arg APP_COMMIT=${{ github.sha }} \
            -t $IMAGE_NAME:${{ github.sha }} \
            -t $IMAGE_NAME:latest .

      - name: Escanear imagen con Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: '${{ env.IMAGE_NAME }}:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Subir resultados de Trivy a GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Publicar imagen de Docker en GHCR
        run: |
          docker push $IMAGE_NAME:${{ github.sha }}
          docker push $IMAGE_NAME:latest
