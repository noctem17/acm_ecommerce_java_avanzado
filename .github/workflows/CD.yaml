#Nombre del workflow que se va a ejecutar "Despliegue Continuo"
name: CD Pipeline

# Disparadores del workflow 
on:
  push:
    branches: [ "main" ] # Cuando se haga push a la rama main

# Persmisos que necesita el worflow para ejecutar los jobs
permissions:
  contents: read
  packages: write  

concurrency:
  group: cd-production
  cancel-in-progress: false

# Tareas que se ejecutan en el workflow
jobs:
  #Construir el jar y la imagen de docker para subirla al registro de github
  build-and-push:
    # Corre en una maquina virtual de Ubuntu
    runs-on: ubuntu-latest
    # La salida del job se llama imagen y el nombre de esta va a a ser el valor de una variable
    outputs:
      image: ${{ steps.vars.outputs.image }}
    # Pasos para realizar el job 
    steps:
      # Trae el codigo fuente que se va a compilar para el jar desde el repositorio
      - name: Checkout del código 
        uses: actions/checkout@v4
      # Configurar la maquina virtual donde se va a compilar el jar
      - name: Configurar Java y Caché
        uses: actions/setup-java@v4 
        with:
        # La VM va a usar java 17 y la distribución de java de temurin
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle' # En cache guarda las dependencias que gradle descarga
          # Esto para restaurar desde la cache las dependencias y no ir a buscarlas 
          # Y descargarlas siempre
        
        # Ejecuta el comando de consola para darle permisos de ejecución 
        # a gradle
      - name: Dar permisos de ejecución a Gradle
        run: chmod +x ./gradlew
        # Compilar y generar el ejecutable del proyecto
      - name: Construir el archivo JAR
        run: ./gradlew build -x test

        # Definir el nombre de la imagen docker que se va a subir al registro 
        # de github en una variable que pueda leer la siguiente tarea (despliegue)
        # Aqui se construye el nombre de la imagen
      - name: Definir nombre de la imagen
        id: vars
        run: | 
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${OWNER}/acm-ecommerce:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      # Se inicia sesion en el registro 
      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
    
    # Construir la imagen de docker con el nombre que se creo antes
      - name: Construir imagen de Docker
        run: |
          docker build \
            --build-arg GIT_COMMIT=${{ github.sha }} \
            -t "${{ steps.vars.outputs.image }}" .

    # Se sube la imagen al registro de github
      - name: Publicar imagen en GHCR
        run: docker push "${{ steps.vars.outputs.image }}"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ needs.build-and-push.outputs.image }}
      COMMIT: ${{ github.sha }}
    steps:
      - name: Desplegar imagen en Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          IMAGE_ENCODED=$(jq -rn --arg v "$IMAGE" '$v|@uri')
          echo "Desplegando $IMAGE"
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK&imgURL=$IMAGE_ENCODED"

      - name: Verificar despliegue en la URL pública
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          echo "Esperando a que $APP_URL responda con el commit $COMMIT ..."
          for i in $(seq 1 40); do
            RESPONSE=$(curl -s "$APP_URL/api/v1/version" || true)
            echo "Intento $i: $RESPONSE"
            if echo "$RESPONSE" | grep -q "$COMMIT"; then
              echo "Despliegue verificado"
              exit 0
            fi
            sleep 15
          done
          echo "La aplicación no respondió con la nueva versión a tiempo"
          exit 1